<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | CodeKing</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/logos/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="cursor-dot"></div><div class="cursor-glow"></div>
<div class="error-page">
  <div class="hero__bg"><span class="blob blob--1"></span><span class="blob blob--2"></span></div>
  <div style="position:relative;">
    <div class="error-page__code">404</div>
    <h1 style="font-size:var(--fs-2xl);margin-top:var(--space-4);">This page took a wrong turn.</h1>
    <p style="color:var(--text-secondary);max-width:44ch;margin:var(--space-4) auto var(--space-8);">The page you're looking for doesn't exist, or may have moved. Let's get you back on track.</p>
    <div style="display:flex;gap:var(--space-4);justify-content:center;flex-wrap:wrap;">
      <a href="index.html" class="btn btn-primary magnetic"><i class="fa-solid fa-house"></i> Back to Home</a>
      <a href="contact.html" class="btn btn-ghost magnetic"><i class="fa-solid fa-paper-plane"></i> Contact Me</a>
    </div>
  </div>
</div>
<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/animation.js"></script>
</body>
</html>
